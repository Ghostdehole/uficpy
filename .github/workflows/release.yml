name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scrcpy_version:
        description: 'latest / locked / exact version (protocol compatibility is checked)'
        default: latest
        required: true
        type: string
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: uficpy-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SCRCPY_REQUEST: ${{ inputs.scrcpy_version || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download latest official scrcpy and verify compatibility
        run: python3 scripts/sync_core.py --version "$SCRCPY_REQUEST"
      - name: Skip unchanged scheduled releases
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/release_needed.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check.outputs.needed == 'true'
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.needed == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        if: steps.check.outputs.needed == 'true'
      - run: npm ci
        if: steps.check.outputs.needed == 'true'
      - run: npx playwright install --with-deps chrome
        if: steps.check.outputs.needed == 'true'
      - name: Tests including Chromium video and plugin
        if: steps.check.outputs.needed == 'true'
        run: sh scripts/test.sh
      - name: Build and package
        if: steps.check.outputs.needed == 'true'
        id: package
        run: |
          APP_VERSION=$(cat VERSION)
          CORE_VERSION=$(cat version.txt)
          RELEASE_TAG="v${APP_VERSION}-scrcpy${CORE_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.appVersion=${APP_VERSION}" -o dist/uficpy-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.appVersion=${APP_VERSION}" -o dist/uficpy-armv7 .
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          python3 scripts/release_notes.py > dist/release-notes.md
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_asset=uficpy_plugin-v${APP_VERSION}.js" >> "$GITHUB_OUTPUT"
      - name: Upload complete release as draft, then publish atomically
        if: steps.check.outputs.needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          APP_VERSION: ${{ steps.package.outputs.app_version }}
          PLUGIN_ASSET: ${{ steps.package.outputs.plugin_asset }}
        run: |
          gh release create "$RELEASE_TAG" dist/uficpy-arm64.tar.gz dist/uficpy-armv7.tar.gz dist/uficpy-source.zip dist/uficpy-mirror.zip "dist/$PLUGIN_ASSET" dist/repo.json dist/release.json dist/core-lock.json dist/SHA256SUMS --draft --target "$GITHUB_SHA" --title "uficpy $APP_VERSION" --notes-file dist/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
