name: Test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: sh scripts/test.sh
        env:
          UFICPY_SCREENSHOT_DIR: test-results/screenshots
      - name: Upload browser screenshots
        if: always() && hashFiles('test-results/screenshots/*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uficpy-ui-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: test-results/screenshots/*.png
          retention-days: 14
      - name: Build ARM64 and ARMv7 preview packages
        env:
          PREVIEW_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          APP_VERSION=$(cat VERSION)
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.appVersion=${APP_VERSION}" -o dist/uficpy-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.appVersion=${APP_VERSION}" -o dist/uficpy-armv7 .
          python3 scripts/package_release.py --tag "$PREVIEW_TAG" --repository "$GITHUB_REPOSITORY"
          python3 scripts/release_notes.py > dist/release-notes.md
      - name: Upload preview packages for device testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uficpy-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: |
            dist/uficpy-arm64.tar.gz
            dist/uficpy-armv7.tar.gz
            dist/uficpy_plugin-v*.js
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
